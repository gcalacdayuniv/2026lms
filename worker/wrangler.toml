# worker/wrangler.toml
name = '2026-api'
main = "worker.js"
compatibility_date = "2024-01-01"

# Keep variables and secrets that exist only in the Cloudflare dashboard (such as SESSION_SECRET) when this file is deployed.
keep_vars = true

[vars]
ALLOWED_ORIGIN = "https://plv.workers.dev" 
GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzr8skhGTi7Tn0IAvwOO_9UJopr7IGFpzRRGM762LyWH7FSh93I7rHw7_4pX0SI8VlM/exec"

# Secrets set in the Cloudflare dashboard (Worker > Settings > Variables and Secrets), never in this file:
#   SESSION_SECRET  signs login tokens (16+ random characters)
#   GAS_SECRET      the same value as the SECRET script property in the Apps Script project; without it the
#                   Apps Script web address above works for anyone who knows it

[[d1_databases]]
binding = "DB"
database_name = "online-portal-db"
database_id = "429e0eb9-79e2-4ddf-84e6-d54c857e0943"
