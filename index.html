<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased overflow-x-hidden">
    <div id="app-root" class="w-full min-h-screen">
        <!-- Dynamic content injected here -->
    </div>
    
    <!-- Global Image View Modal -->
    <div id="globalImageModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center fade-in">
        <div class="absolute inset-0 bg-black bg-opacity-90 backdrop-blur-sm cursor-pointer" id="closeGlobalImageBg"></div>
        <button id="closeGlobalImageBtn" class="absolute top-4 right-4 text-white hover:text-gray-300 z-10 p-2 focus:outline-none">
            <i class="fa-solid fa-xmark text-3xl"></i>
        </button>
        <div class="relative z-10 flex flex-col items-center justify-center w-full h-full p-4 pointer-events-none">
            <img id="globalImageSrc" class="max-w-[90%] max-h-[80vh] object-contain rounded-lg shadow-2xl scale-up pointer-events-auto" src="" alt="Full Screen Preview">
            <div id="globalImageControls" class="mt-6 flex items-center justify-center space-x-6 hidden pointer-events-auto">
                <button id="prevGlobalImageBtn" class="text-white hover:text-blue-400 focus:outline-none text-3xl transition"><i class="fa-solid fa-circle-chevron-left"></i></button>
                <span id="globalImageName" class="text-white text-xl font-bold tracking-wide"></span>
                <button id="nextGlobalImageBtn" class="text-white hover:text-blue-400 focus:outline-none text-3xl transition"><i class="fa-solid fa-circle-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
