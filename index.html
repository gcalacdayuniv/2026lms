<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased overflow-x-hidden">
    <div id="app-root" class="w-full min-h-screen">
        <!-- Dynamic content injected here -->
    </div>
    
    <!-- Global Image View Modal -->
    <div id="globalImageModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center fade-in">
        <div class="absolute inset-0 bg-black bg-opacity-90 backdrop-blur-sm cursor-pointer" id="closeGlobalImageBg"></div>
        <button id="closeGlobalImageBtn" class="absolute top-4 right-4 text-white hover:text-gray-300 z-10 p-2 focus:outline-none">
            <i class="fa-solid fa-xmark text-3xl"></i>
        </button>

        <div class="relative z-10 flex flex-col items-center max-w-[95%] sm:max-w-[90%] max-h-[90vh]">
            <img id="globalImageSrc" class="max-w-full max-h-[70vh] sm:max-h-[75vh] object-contain rounded-lg shadow-2xl scale-up" src="" alt="Full Screen Preview">
            
            <div class="w-full flex justify-center items-center gap-2 sm:gap-0 mt-4">
                <button id="prevGlobalImageBtn" class="sm:fixed sm:left-4 sm:top-1/2 sm:transform sm:-translate-y-1/2 text-white hover:text-gray-300 z-10 p-2 sm:p-4 focus:outline-none hidden flex-shrink-0">
                    <i class="fa-solid fa-chevron-left text-3xl sm:text-5xl drop-shadow-md"></i>
                </button>

                <div id="globalImageDetails" class="text-center text-white hidden bg-black bg-opacity-50 px-4 py-2 sm:px-6 sm:py-3 rounded-lg backdrop-blur-md fade-in max-w-[75%] sm:max-w-none">
                    <h3 id="giName" class="text-lg sm:text-2xl font-bold tracking-tight"></h3>
                    <p id="giInfo" class="text-xs sm:text-base text-gray-200 mt-1 font-medium"></p>
                </div>

                <button id="nextGlobalImageBtn" class="sm:fixed sm:right-4 sm:top-1/2 sm:transform sm:-translate-y-1/2 text-white hover:text-gray-300 z-10 p-2 sm:p-4 focus:outline-none hidden flex-shrink-0">
                    <i class="fa-solid fa-chevron-right text-3xl sm:text-5xl drop-shadow-md"></i>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
